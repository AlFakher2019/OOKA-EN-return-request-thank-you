<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <head>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet">
  </head>


  <title>Application Submitted</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 60px 16px;
      background-color: #fff;
      margin: 0;
    }

    .logo {
      width: 98px;
      height: 98px;
      margin: 0 auto 24px;
    }

    .logo img {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 26px;
      color: #101114;
      font-weight: 600;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      color: #35363B;
      max-width: 500px;
      margin: 20px auto 0;
    }

    .shop-btn {
      margin: 24px auto;
      border: 1px solid #6A16D2;
      padding: 14px 32px;
      border-radius: 50px;
      background: #6A16D2;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      outline: none;
    }
  </style>
</head>

<body>
  <div class="logo">
    <img src="image (10).png" />
  </div>

  <h1> Your request has been submitted! </h1>
  <p>
   Our team will follow up over email to confirm details and process your request within 2-3 business days.
  </p>

  <a href="https://de.ooka.com/en">
  <button class="shop-btn">RETURN TO SHOPPING</button>
</a>
</body>

</html>
